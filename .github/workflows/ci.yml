name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # The catalog-pin watcher opens its bump PR with GITHUB_TOKEN, and GitHub does
  # not start workflows for pushes/PRs made with that token (the PR sat with no
  # checks at all, MIO-2998). It dispatches this workflow on the bump branch
  # instead; the check runs attach to the PR's head commit like any other.
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build, Vet, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test ./... -race -timeout 120s

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Build golangci-lint with the project's Go toolchain (setup-go above).
      # The prebuilt release binaries are compiled with an older Go and refuse to
      # lint a project that targets a newer Go ("the Go language version used to
      # build golangci-lint is lower than the targeted Go version"), so we
      # `go install` it instead. v2.x is required for the v2-format .golangci.yml.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: golangci-lint
        run: golangci-lint run ./...
